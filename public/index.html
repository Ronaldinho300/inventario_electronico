<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario Electrónico</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface2: #1f1f1f;
      --border: #2a2a2a;
      --accent: #00e5a0;
      --accent2: #ff4d6d;
      --accent3: #ffd166;
      --text: #f0f0f0;
      --text-muted: #777;
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      padding: 0 0 60px 0;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    header .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    header span {
      color: var(--accent);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* FORM */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 32px;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    input, textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    input::placeholder, textarea::placeholder {
      color: var(--text-muted);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 22px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: var(--accent2);
      color: #fff;
    }

    .btn-warning {
      background: var(--accent3);
      color: #000;
    }

    button:hover { opacity: 0.85; }

    /* TABLE */
    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .table-header .label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
    }

    .count-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 0.75rem;
      font-family: 'Space Mono', monospace;
      color: var(--text-muted);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead tr {
      border-bottom: 2px solid var(--accent);
    }

    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 700;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    tbody tr:hover {
      background: var(--surface2);
    }

    td {
      padding: 12px 14px;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
    }

    td.nombre-col {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
    }

    td.precio-col {
      color: var(--accent);
      font-weight: 700;
    }

    td.stock-col span {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
    }

    td.stock-col span.low {
      border-color: var(--accent2);
      color: var(--accent2);
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .actions button {
      padding: 6px 12px;
      font-size: 0.7rem;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      width: 480px;
      max-width: 95vw;
      position: relative;
    }

    .modal-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent3);
      margin-bottom: 20px;
    }

    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 28px; height: 28px;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 1rem;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: 0.82rem;
      font-family: 'Space Mono', monospace;
      color: var(--accent);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s;
      pointer-events: none;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error {
      border-color: var(--accent2);
      color: var(--accent2);
    }

    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="dot"></div>
    <h1>Inventario <span>Electrónico</span></h1>
  </header>

  <div class="container">

    <!-- FORM AGREGAR -->
    <div class="card">
      <div class="card-title" id="form-title">＋ Agregar Producto</div>
      <div class="form-grid">
        <input type="hidden" id="edit-id">
        <input type="text" id="nombre" placeholder="Nombre del producto" required>
        <input type="text" id="descripcion" placeholder="Descripción">
        <input type="number" id="precio" placeholder="Precio (S/)" step="0.01" required>
        <input type="number" id="stock" placeholder="Stock" required>
      </div>
      <div class="btn-row">
        <button class="btn-primary" onclick="guardarProducto()">Guardar</button>
        <button class="btn-secondary" onclick="cancelarEdicion()">Cancelar</button>
      </div>
    </div>

    <!-- TABLA -->
    <div class="table-header">
      <span class="label">Lista de Productos</span>
      <span class="count-badge" id="count-badge">0 productos</span>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr><td colspan="7" class="empty-state">Cargando productos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL CONFIRMACIÓN ELIMINAR -->
  <div class="modal-overlay" id="modal-delete">
    <div class="modal">
      <div class="modal-close" onclick="cerrarModal()">✕</div>
      <div class="modal-title">⚠ Confirmar Eliminación</div>
      <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:20px;">
        ¿Seguro que deseas eliminar <strong id="modal-nombre" style="color:var(--text)"></strong>? Esta acción no se puede deshacer.
      </p>
      <div class="btn-row">
        <button class="btn-danger" onclick="confirmarEliminar()">Sí, eliminar</button>
        <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let productoAEliminar = null;

    // ── TOAST ──────────────────────────────────────────────
    function showToast(msg, tipo = 'ok') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (tipo === 'error' ? ' error' : '');
      setTimeout(() => t.className = 'toast', 2500);
    }

    // ── CARGAR PRODUCTOS ───────────────────────────────────
    async function cargarProductos() {
      try {
        const res = await fetch('/productos');
        const data = await res.json();
        const tbody = document.getElementById('tabla-body');
        const badge = document.getElementById('count-badge');
        badge.textContent = data.length + ' producto' + (data.length !== 1 ? 's' : '');

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Sin productos registrados</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(p => {
          const fecha = p.fecha_registro ? new Date(p.fecha_registro).toLocaleDateString('es-PE') : '—';
          const stockClass = p.stock <= 5 ? 'low' : '';
          return `
            <tr>
              <td>${p.id}</td>
              <td class="nombre-col">${p.nombre}</td>
              <td>${p.descripcion || '—'}</td>
              <td class="precio-col">S/ ${parseFloat(p.precio).toFixed(2)}</td>
              <td class="stock-col"><span class="${stockClass}">${p.stock}</span></td>
              <td>${fecha}</td>
              <td class="actions">
                <button class="btn-warning" onclick="editarProducto(${p.id}, '${escapar(p.nombre)}', '${escapar(p.descripcion || '')}', ${p.precio}, ${p.stock})">Editar</button>
                <button class="btn-danger" onclick="pedirEliminar(${p.id}, '${escapar(p.nombre)}')">Eliminar</button>
              </td>
            </tr>`;
        }).join('');
      } catch (e) {
        showToast('Error al cargar productos', 'error');
      }
    }

    function escapar(str) {
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // ── GUARDAR (CREAR o EDITAR) ───────────────────────────
    async function guardarProducto() {
      const id     = document.getElementById('edit-id').value;
      const nombre = document.getElementById('nombre').value.trim();
      const desc   = document.getElementById('descripcion').value.trim();
      const precio = document.getElementById('precio').value;
      const stock  = document.getElementById('stock').value;

      if (!nombre || !precio || !stock) {
        showToast('Completa todos los campos obligatorios', 'error');
        return;
      }

      const body = { nombre, descripcion: desc, precio: parseFloat(precio), stock: parseInt(stock) };

      try {
        if (id) {
          // ACTUALIZAR
          const res = await fetch('/productos/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          if (!res.ok) throw new Error();
          showToast('Producto actualizado ✓');
        } else {
          // CREAR
          const res = await fetch('/productos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          if (!res.ok) throw new Error();
          showToast('Producto agregado ✓');
        }
        cancelarEdicion();
        cargarProductos();
      } catch {
        showToast('Error al guardar producto', 'error');
      }
    }

    // ── EDITAR ─────────────────────────────────────────────
    function editarProducto(id, nombre, descripcion, precio, stock) {
      document.getElementById('edit-id').value = id;
      document.getElementById('nombre').value = nombre;
      document.getElementById('descripcion').value = descripcion;
      document.getElementById('precio').value = precio;
      document.getElementById('stock').value = stock;
      document.getElementById('form-title').textContent = '✎ Editando Producto #' + id;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicion() {
      document.getElementById('edit-id').value = '';
      document.getElementById('nombre').value = '';
      document.getElementById('descripcion').value = '';
      document.getElementById('precio').value = '';
      document.getElementById('stock').value = '';
      document.getElementById('form-title').textContent = '＋ Agregar Producto';
    }

    // ── ELIMINAR ───────────────────────────────────────────
    function pedirEliminar(id, nombre) {
      productoAEliminar = id;
      document.getElementById('modal-nombre').textContent = nombre;
      document.getElementById('modal-delete').classList.add('active');
    }

    function cerrarModal() {
      productoAEliminar = null;
      document.getElementById('modal-delete').classList.remove('active');
    }

    async function confirmarEliminar() {
      if (!productoAEliminar) return;
      try {
        const res = await fetch('/productos/' + productoAEliminar, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        showToast('Producto eliminado ✓');
        cerrarModal();
        cargarProductos();
      } catch {
        showToast('Error al eliminar', 'error');
        cerrarModal();
      }
    }

    // ── INIT ───────────────────────────────────────────────
    cargarProductos();
  </script>
</body>
</html>
