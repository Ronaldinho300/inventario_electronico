services:

  # ── Base de datos MySQL ──────────────────────────────────
  db:
    image: mysql:8.0
    container_name: inventario_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: inventario_electronico
      MYSQL_USER: inventario_user
      MYSQL_PASSWORD: inventario1234
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql          # datos persistentes
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql  # carga el SQL al iniciar
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Aplicación Node.js ───────────────────────────────────
  app:
    build: .
    container_name: inventario_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: inventario_user
      DB_PASSWORD: inventario1234
      DB_NAME: inventario_electronico
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy   # espera que MySQL esté listo

volumes:
  db_data: